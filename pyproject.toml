[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantitative-trading-local"
version = "2.0.0"
description = "OKX market data, MACD research, paper backtests and local dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Flask>=2.2,<4", "PyMySQL>=1.1,<2", "ollama>=0.6,<1"]

[project.scripts]
quant-trading = "quantitative_trading.cli:main"
quant-dashboard = "quantitative_trading.dashboard:run"
quant-features = "quantitative_trading.indicators:main"
quant-model = "quantitative_trading.llm:main"

[tool.setuptools.packages.find]
include = ["quantitative_trading*"]

[tool.setuptools.package-data]
quantitative_trading = ["web/*.html", "web/static/*.css", "web/static/*.js"]

[tool.ruff]
line-length = 100
target-version = "py310"
